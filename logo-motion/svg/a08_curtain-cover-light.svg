<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Nine squares cover the page"><title>Nine squares cover the page</title><style>.a8-q{transform-box:fill-box;transform-origin:center;transform:scale(0)}@media (prefers-reduced-motion:no-preference){.a8-cover .a8-b0{animation:a8-cover0 500ms linear 0ms 1 normal both}.a8-cover .a8-b1{animation:a8-cover1 500ms linear 0ms 1 normal both}.a8-cover .a8-b2{animation:a8-cover2 500ms linear 0ms 1 normal both}@keyframes a8-cover0{0%{transform:scale(0);animation-timing-function:cubic-bezier(.2,.7,.2,1)}64%{transform:scale(1.0001)}100%{transform:scale(1)}}@keyframes a8-cover1{0%{transform:scale(0)}18%{transform:scale(0.0001);animation-timing-function:cubic-bezier(.2,.7,.2,1)}82%{transform:scale(1.0001)}100%{transform:scale(1)}}@keyframes a8-cover2{0%{transform:scale(0)}36%{transform:scale(0.0001);animation-timing-function:cubic-bezier(.2,.7,.2,1)}100%{transform:scale(1)}}}</style><g class="a8-cover"><rect class="a8-q a8-q0 a8-b0 " x="-0.5" y="-0.5" width="101" height="101" fill="#1F3A80"/><rect class="a8-q a8-q1 a8-b0 " x="99.5" y="-0.5" width="101" height="101" fill="#1F3A80"/><rect class="a8-q a8-q2 a8-b1 " x="199.5" y="-0.5" width="101" height="101" fill="#355DA6"/><rect class="a8-q a8-q3 a8-b0 " x="-0.5" y="99.5" width="101" height="101" fill="#1F3A80"/><rect class="a8-q a8-q4 a8-b1 " x="99.5" y="99.5" width="101" height="101" fill="#355DA6"/><rect class="a8-q a8-q5 a8-b2 " x="199.5" y="99.5" width="101" height="101" fill="#6F8FCB"/><rect class="a8-q a8-q6 a8-b1 " x="-0.5" y="199.5" width="101" height="101" fill="#355DA6"/><rect class="a8-q a8-q7 a8-b2 " x="99.5" y="199.5" width="101" height="101" fill="#6F8FCB"/><rect class="a8-q a8-q8 a8-b2 " x="199.5" y="199.5" width="101" height="101" fill="#6F8FCB"/></g></svg>
