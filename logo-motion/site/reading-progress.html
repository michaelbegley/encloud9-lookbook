<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reading progress demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F9FC;color:#0E1A3A;font-family:'Hanken Grotesk',Arial,sans-serif}
article{max-width:680px;margin:0 auto;padding:96px 24px 160px}
h1{margin:0 0 24px;font-size:40px;line-height:48px}
.line{height:12px;margin:0 0 12px;background:#D7DEEA}
.line.short{width:62%}
.gap{height:24px}
.progress{position:fixed;right:24px;bottom:24px;width:40px;height:40px;padding:4px;background:#FFFFFF;border:1px solid #D7DEEA}
.progress svg{display:block;width:100%;height:100%}
.progress rect{fill:#D7DEEA}
.progress rect.on{fill:var(--c)}
@media (prefers-reduced-motion:no-preference){.progress rect{transition:fill 150ms cubic-bezier(.2,.7,.2,1)}}
</style>
</head>
<body>
<article>
<h1>Blog post</h1>
<div id="body"></div>
</article>
<div class="progress" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0">
<svg viewBox="0 0 16 16" aria-hidden="true">
<rect x="1" y="1" width="4" height="4" style="--c:#1F3A80"/><rect x="6" y="1" width="4" height="4" style="--c:#1F3A80"/><rect x="11" y="1" width="4" height="4" style="--c:#355DA6"/>
<rect x="1" y="6" width="4" height="4" style="--c:#1F3A80"/><rect x="6" y="6" width="4" height="4" style="--c:#355DA6"/><rect x="11" y="6" width="4" height="4" style="--c:#6F8FCB"/>
<rect x="1" y="11" width="4" height="4" style="--c:#355DA6"/><rect x="6" y="11" width="4" height="4" style="--c:#6F8FCB"/><rect x="11" y="11" width="4" height="4" style="--c:#6F8FCB"/>
</svg>
</div>
<script>
// Placeholder text lines, so the page can scroll.
var b = document.getElementById('body'), html = '';
for (var p = 0; p < 18; p++) { for (var l = 0; l < 5; l++) html += '<div class="line' + (l === 4 ? ' short' : '') + '"></div>'; html += '<div class="gap"></div>'; }
b.innerHTML = html;
// One square per ninth of the post, in reading order.
var bar = document.querySelector('.progress'), sq = bar.querySelectorAll('rect'), art = document.querySelector('article');
function update() {
  var top = art.offsetTop, h = art.offsetHeight - window.innerHeight;
  var frac = h > 0 ? Math.min(1, Math.max(0, (window.scrollY - top) / h)) : 1;
  var n = frac >= 1 ? 9 : Math.floor(frac * 9);
  for (var i = 0; i < 9; i++) sq[i].classList.toggle('on', i < n);
  bar.setAttribute('aria-valuenow', n);
}
addEventListener('scroll', update, {passive: true}); addEventListener('resize', update); update();
</script>
</body>
</html>
